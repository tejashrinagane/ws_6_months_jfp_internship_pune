<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
        }
        .transFormBox:hover{
            transform: translate(200px, 300px);
        }
        .scaleBox:hover{
            transform: scale(0.2,0.2);
        }
        .rotateBox:hover{
            transform: rotate(-60deg);
        }
        .skewBox:hover{
            transform: skew(45deg);
        }
        .boxTransitionOne{
            transition: background-color 10s, transform 7s, color 5s, font-size 5s, border-radius 5s, padding 10s;
        }
        .boxTransitionOne:hover{
            background-color: black;
            transform: translate(200px, 200px);
            color: white;
            font-size: 30px;
            border-radius: 50%;
            padding: 20px;
        }
        .heartBlink{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* vertical-align: center;
            text-align: center; */
            font-size: 50px;
            color: red;
            animation: hearBlinkikng 3s 5s infinite;
        }
        @keyframes hearBlinkikng{
            1%{font-size: 100px;}
            10%{font-size: 10px;}
            25%{font-size: 100px;}
            50%{font-size: 10px;}
            75%{font-size: 100px;}
            90%{font-size: 10px;}
            95%{font-size: 100px;}
            100%{font-size: 10px;}
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="heartBlink">
        <i class="fa-solid fa-heart"></i>
    </div>

    <div class="box boxTransitionOne">JOB</div>
    <div class="box"></div>
    <div class="box transFormBox"></div>
    <div class="box scaleBox"></div>
    <div class="box rotateBox"></div>
    <div class="box skewBox"></div>
</body>
</html>
